name: Build and test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.SHELF_KEYSTORE_B64 }}
          SHELF_KEYSTORE_PASSWORD: ${{ secrets.SHELF_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shelf.keystore"
            export SHELF_KEYSTORE_PATH="$RUNNER_TEMP/shelf.keystore"
          else
            echo "::warning::No signing secret set. Using a temporary key, so updates will need an uninstall first."
          fi
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleRelease :demo-apps:assembleDebug --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Show the compiler errors as annotations on the run page.
            { grep -E "^e: " build.log; grep -A20 "What went wrong" build.log; } | head -80 > errors.txt
            echo "::error title=Build failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ShelfLauncher.apk
          mkdir -p demo-apks
          cp demo-apps/build/outputs/apk/*/debug/*.apk demo-apks/

      # Runs the launcher on an Android TV 10 emulator before publishing.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash scripts/tv-smoke-test.sh
            bash scripts/record-demo.sh || true
            bash scripts/hebrew-screens.sh || true

      - name: Make demo GIF
        if: always()
        run: |
          [ -d screenshots/demo ] || exit 0
          command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          bash scripts/make-demo-video.sh || true

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-screenshots
          path: screenshots/
          if-no-files-found: ignore

      # Also publish the screenshots to a branch, so they can be viewed without signing in.
      - name: Publish test results branch
        if: always()
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q -b test-results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Test results for run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" test-results

      # Only reached when the build and the emulator test both passed.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shelf ${{ github.run_number }}
          make_latest: "true"
          files: ShelfLauncher.apk
